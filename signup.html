<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101711">
<title>TANTU 坦途｜赛事复制</title>
<style>
:root{--bg:#101711;--panel:#18211a;--line:#344336;--muted:#92a092;--text:#f2f4eb;--lime:#c5f26a;--gold:#dda960}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -20%,#283923 0,transparent 45%),var(--bg);color:var(--text);font:15px system-ui,-apple-system,"Noto Sans SC",sans-serif;min-height:100vh;padding-bottom:104px}.top{height:62px;border-bottom:1px solid #ffffff12;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#101711ed;position:sticky;top:0;z-index:2;backdrop-filter:blur(14px)}.brand{display:flex;gap:9px;align-items:center;font-weight:800;letter-spacing:.06em;font-size:13px}.brand img{width:32px;height:38px;object-fit:contain}.brand small{display:block;font-size:8px;color:var(--muted);letter-spacing:.12em;margin-top:2px}.back{color:var(--lime);text-decoration:none;font-size:12px;font-weight:700}.wrap{width:min(680px,100%);margin:auto;padding:22px 14px 40px}.intro{margin:4px 2px 19px}.eyebrow{font:10px monospace;letter-spacing:.2em;color:var(--lime)}h1{font-size:27px;margin:8px 0 5px}.intro p{font-size:12px;color:var(--muted);margin:0}.card{background:linear-gradient(145deg,#1b251d,#172019);border:1px solid #2c3a2e;border-radius:17px;padding:17px 15px;margin:12px 0}.label{font-size:11px;color:#a5b19f;font-weight:700;margin-bottom:7px;display:block}.field{margin-bottom:15px}.input{width:100%;min-height:47px;border:1px solid var(--line);border-radius:10px;background:#111a13;color:var(--text);padding:11px 12px;font:inherit;outline:none}.input:focus{border-color:var(--lime);box-shadow:0 0 0 3px #c5f26a12}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.hint{font-size:11px;color:var(--muted);line-height:1.55;margin-top:8px}.countbox{display:flex;align-items:stretch;gap:8px}.countbox button{width:52px;border:1px solid var(--line);border-radius:10px;background:#202b21;color:var(--lime);font-size:24px}.countbox input{flex:1;text-align:center;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}.presets{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.preset{min-width:48px;min-height:38px;border:1px solid var(--line);border-radius:9px;background:#202b21;color:#ccd5c6;font-size:12px}.preset.active{background:#c5f26a18;border-color:var(--lime);color:var(--lime);font-weight:800}.section-title{font-size:13px;font-weight:800;margin:0 0 13px;display:flex;align-items:center;gap:8px}.section-title i{font:10px monospace;color:var(--lime);border:1px solid #c5f26a44;border-radius:6px;padding:3px 6px;font-style:normal}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:1px solid var(--line);border-radius:10px;min-height:48px;background:#202b21;color:var(--text);font-weight:800;font-size:14px}.btn.primary{background:var(--lime);border-color:var(--lime);color:#172011}.preview{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.75 "Noto Sans SC",system-ui,sans-serif;color:#e7ece4;background:#111812;border:1px solid #344336;border-radius:12px;padding:15px;min-height:140px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#e4f7c5;color:#15210f;padding:11px 17px;border-radius:10px;font-weight:800;transition:.2s;z-index:5}.toast.on{opacity:1;transform:translate(-50%,0)}@media(min-width:600px){.wrap{padding-top:36px}.card{padding:20px}.actions .btn{min-height:52px}}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #ffffff18;background:#111912f2;backdrop-filter:blur(14px)}.bottom-nav a{display:flex;align-items:center;justify-content:center;min-height:48px;border:1px solid #c5f26a;border-radius:11px;background:#c5f26a;color:#172011;text-decoration:none;font-weight:800;font-size:14px}</style>
</head>
<body>
<header class="top"><div class="brand"><img src="tantu-logo.png" alt="TANTU 坦途标志"><div>TANTU 坦途<small>FOOTBALL CLUB · MATCH DESK</small></div></div><a class="back" href="index.html?view=mobile">赛事公告工作台</a></header>
<main class="wrap"><div class="intro"><div class="eyebrow">TANTU · SIGN UP</div><h1>赛事复制</h1><p>填写比赛信息，生成接龙名单并复制到微信群。</p></div>
<section class="card"><h2 class="section-title"><i>01</i> 比赛信息</h2>
<div class="field"><label class="label" for="matchDate">比赛日期</label><div class="row"><input class="input" id="matchDate" type="date"><input class="input" id="matchTime" type="time" value="20:00" aria-label="比赛时间"></div><div class="hint">默认当天 20:00，可快速选择日期与时间。</div></div>
<div class="field"><label class="label" for="venue">比赛场地</label><input class="input" id="venue" value="霞街" placeholder="例如：霞街"></div>
<div class="field" style="margin-bottom:0"><label class="label" for="eventType">赛事性质</label><input class="input" id="eventType" value="内部友谊赛" placeholder="例如：内部友谊赛"></div>
</section>
<section class="card"><h2 class="section-title"><i>02</i> 报名人数</h2><label class="label" for="count">选择人数</label><div class="countbox"><button id="minus" aria-label="减少人数">−</button><input class="input" id="count" type="number" min="1" max="99" value="16" inputmode="numeric"><button id="plus" aria-label="增加人数">＋</button></div><div class="presets" id="presets"></div><div class="hint">可点快捷人数，也可输入 1–99 人。</div></section>
<section class="card"><h2 class="section-title"><i>03</i> 生成报名信息</h2><div class="actions"><button class="btn primary" id="generate">生成报名表</button><button class="btn" id="copy">复制到微信群</button></div></section>
<section class="card"><h2 class="section-title"><i>预览</i> 群消息内容</h2><div class="preview" id="preview"></div></section>
</main><nav class="bottom-nav"><a href="index.html?view=mobile">← 返回赛事工作台</a></nav><div class="toast" id="toast">已复制，可粘贴到微信群</div>
<script>
const $=s=>document.querySelector(s),dateInput=$('#matchDate'),timeInput=$('#matchTime'),countInput=$('#count');
function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function updatePresets(){document.querySelectorAll('.preset').forEach(b=>b.classList.toggle('active',Number(b.dataset.count)===Number(countInput.value)))}
function getMessage(){const date=dateInput.value||todayISO(),time=timeInput.value||'20:00',[y,m,d]=date.split('-').map(Number),[hh,mm]=time.split(':').map(Number),sameDay=date===todayISO(),period=hh<12?'上午':hh<18?'下午':'晚',hour=hh%12||12,timeText=`${period}${hour}${mm?`:${String(mm).padStart(2,'0')}`:''}点`,dateText=sameDay&&hh>=18?`今晚${m}月${d}晚`:sameDay?`今天${m}月${d}${period}`:`${m}月${d}日${period}`,venue=$('#venue').value.trim()||'待定',venueText=venue.endsWith('场')?venue:`${venue}场`,event=$('#eventType').value.trim()||'友谊赛',n=Math.max(1,Math.min(99,parseInt(countInput.value,10)||16));return `@所有人\n${dateText}${hour}${mm?`:${String(mm).padStart(2,'0')}`:''}点，${venueText}\n${event}：\n限${n}人\n${Array.from({length:n},(_,i)=>i+1).join('\n')}`}function render(){countInput.value=Math.max(1,Math.min(99,parseInt(countInput.value,10)||16));$('#preview').textContent=getMessage();updatePresets()}
function toast(text){$('#toast').textContent=text;$('#toast').classList.add('on');setTimeout(()=>$('#toast').classList.remove('on'),2000)}
const today=todayISO();dateInput.value=today;document.getElementById('presets').innerHTML=[8,10,12,14,16,18,20,22,24,30,40].map(n=>`<button class="preset" data-count="${n}">${n}人</button>`).join('');document.querySelectorAll('.preset').forEach(b=>b.onclick=()=>{countInput.value=b.dataset.count;render()});['input','change'].forEach(ev=>{dateInput.addEventListener(ev,render);timeInput.addEventListener(ev,render);countInput.addEventListener(ev,render);$('#venue').addEventListener(ev,render);$('#eventType').addEventListener(ev,render)});$('#minus').onclick=()=>{countInput.value=Math.max(1,(parseInt(countInput.value,10)||1)-1);render()};$('#plus').onclick=()=>{countInput.value=Math.min(99,(parseInt(countInput.value,10)||0)+1);render()};$('#generate').onclick=()=>{render();toast('报名表已生成')};$('#copy').onclick=async()=>{render();const text=getMessage();try{await navigator.clipboard.writeText(text)}catch{const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();document.execCommand('copy');t.remove()}toast('已复制，可粘贴到微信群')};render();
</script></body></html>
